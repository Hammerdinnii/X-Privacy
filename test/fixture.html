<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>X Privacy — DOM fixture</title>
    <!-- A trimmed-down imitation of x.com's DOM, using the same data-testid
         hooks the extension relies on. Used by test/run.mjs. -->
    <style>
      body { margin: 0; background: #000; color: #e7e9ea; font: 15px -apple-system, "Segoe UI", sans-serif; }
      a { color: inherit; text-decoration: none; }
      .layout { display: flex; gap: 24px; padding: 16px; }
      .row { display: flex; align-items: center; gap: 12px; }
      .col-text { display: flex; flex-direction: column; }
      nav { display: flex; flex-direction: column; gap: 10px; width: 260px; }
      button[data-testid="SideNav_AccountSwitcher_Button"] { background: none; border: 0; color: inherit; padding: 12px; border-radius: 999px; width: 100%; text-align: left; cursor: pointer; }
      [data-testid^="UserAvatar-Container-"] { width: 40px; height: 40px; border-radius: 50%; position: relative; }
      [data-testid^="UserAvatar-Container-"] img { width: 100%; height: 100%; border-radius: 50%; display: block; }
      main { flex: 1; max-width: 600px; }
      article { border-bottom: 1px solid #2f3336; padding: 12px; }
      [data-testid="User-Name"] { display: flex; gap: 4px; }
      [data-testid="UserName"] { font-size: 20px; font-weight: 800; }
      #layers [role="menu"] { background: #000; border: 1px solid #2f3336; border-radius: 16px; width: 300px; padding: 8px 0; box-shadow: 0 0 15px rgba(255,255,255,.2); }
      #layers [role="menuitem"] { display: block; padding: 12px 16px; }
    </style>
  </head>
  <body>
    <div id="react-root">
      <div class="layout">
        <header role="banner">
          <nav role="navigation">
            <a href="/home" data-testid="AppTabBar_Home_Link">Home</a>
            <a href="/janedoe" data-testid="AppTabBar_Profile_Link">Profile</a>
            <button aria-label="Account menu" role="button" type="button" data-testid="SideNav_AccountSwitcher_Button" id="switcher">
              <div class="row">
                <div class="col-avatar">
                  <div data-testid="UserAvatar-Container-janedoe" id="sidebar-avatar">
                    <div style="background-image: url('data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7'); width: 100%; height: 100%; border-radius: 50%; position: absolute"></div>
                    <img id="sidebar-avatar-img" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='40'><circle cx='20' cy='20' r='20' fill='%2335d2e8'/></svg>" alt="" />
                  </div>
                </div>
                <div class="col-text" id="sidebar-text">
                  <div><div dir="ltr"><span id="sidebar-name">Jane Doe</span></div></div>
                  <div><div dir="ltr"><span id="sidebar-handle">@janedoe</span></div></div>
                </div>
                <div class="col-more" id="sidebar-more">
                  <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><circle cx="5" cy="12" r="2" /><circle cx="12" cy="12" r="2" /><circle cx="19" cy="12" r="2" /></svg>
                </div>
              </div>
            </button>
          </nav>
        </header>

        <main>
          <div id="profile-header">
            <div data-testid="UserName" id="profile-username">
              <div><span id="profile-name">Jane Doe</span></div>
              <div><span id="profile-handle">@janedoe</span></div>
            </div>
            <div data-testid="UserDescription" id="profile-bio">Just here for the memes.</div>
          </div>

          <section id="timeline">
            <article data-testid="tweet" id="tweet-self">
              <div class="row">
                <div data-testid="Tweet-User-Avatar">
                  <div data-testid="UserAvatar-Container-JaneDoe" id="self-tweet-avatar"><img id="self-tweet-avatar-img" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='40'><circle cx='20' cy='20' r='20' fill='%2335d2e8'/></svg>" alt="" /></div>
                </div>
                <div>
                  <div data-testid="User-Name">
                    <div><a href="/JaneDoe" role="link" id="self-tweet-name"><span>Jane Doe</span></a></div>
                    <div><a href="/JaneDoe" role="link" id="self-tweet-handle"><span>@JaneDoe</span></a><span id="self-tweet-dot">·</span><a href="/JaneDoe/status/1" id="self-tweet-time"><time>2h</time></a></div>
                  </div>
                  <div data-testid="tweetText">Hello world, this is my own post.</div>
                </div>
              </div>
            </article>

            <article data-testid="tweet" id="tweet-other">
              <div class="row">
                <div data-testid="Tweet-User-Avatar">
                  <div data-testid="UserAvatar-Container-someoneelse" id="other-tweet-avatar"><img id="other-tweet-avatar-img" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='40'><circle cx='20' cy='20' r='20' fill='%23f91880'/></svg>" alt="" /></div>
                </div>
                <div>
                  <div data-testid="User-Name">
                    <div><a href="/someoneelse" role="link" id="other-tweet-name"><span>Someone Else</span></a></div>
                    <div><a href="/someoneelse" role="link" id="other-tweet-handle"><span>@someoneelse</span></a><span>·</span><a href="/someoneelse/status/2"><time>3h</time></a></div>
                  </div>
                  <div data-testid="tweetText">Hey <a href="/janedoe" id="mention-link">@janedoe</a> nice post!</div>
                </div>
              </div>
            </article>
          </section>
        </main>
      </div>
    </div>

    <div id="layers">
      <div data-testid="Dropdown">
        <div role="menu">
          <div role="menuitem" id="menu-account">
            <div class="row">
              <div class="col-avatar"><div data-testid="UserAvatar-Container-janedoe" id="menu-avatar"><img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='40'><circle cx='20' cy='20' r='20' fill='%2335d2e8'/></svg>" alt="" /></div></div>
              <div class="col-text" id="menu-text">
                <div dir="ltr"><span id="menu-name">Jane Doe</span></div>
                <div dir="ltr"><span id="menu-handle">@janedoe</span></div>
              </div>
              <div class="col-check" id="menu-check"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z" /></svg></div>
            </div>
          </div>
          <a role="menuitem" href="/i/flow/login" id="menu-add"><span>Add an existing account</span></a>
          <a role="menuitem" href="/account/switch" id="menu-manage"><span>Manage accounts</span></a>
          <a role="menuitem" href="/logout" id="menu-logout"><span id="menu-logout-text">Log out @janedoe</span></a>
        </div>
      </div>
    </div>
  </body>
</html>
