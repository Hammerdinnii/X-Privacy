# Publishes a GitHub release with the packaged extension whenever a v* tag is pushed.
#
#   git tag v2.0.1 && git push origin v2.0.1
#
# The tag must match the "version" in manifest.json. Release notes are taken from
# .github/release-notes/<tag>.md when that file exists, otherwise generated from
# the commits since the previous release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches manifest.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./manifest.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "Tag v$tag does not match manifest version $version" >&2
            exit 1
          fi

      - name: Build the extension zip
        run: bash scripts/package.sh

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="X Privacy ${GITHUB_REF_NAME#v}"
          notes=".github/release-notes/${GITHUB_REF_NAME}.md"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # Release was created first (e.g. from the GitHub UI): attach the zip and apply the notes.
            gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber
            if [ -f "$notes" ]; then
              gh release edit "$GITHUB_REF_NAME" --title "$title" --notes-file "$notes" --latest
            fi
          elif [ -f "$notes" ]; then
            gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$title" --notes-file "$notes" --latest
          else
            gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$title" --generate-notes --latest
          fi
